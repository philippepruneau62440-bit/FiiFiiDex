

name: Build FiiFiiDex APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FiiFiiDex_projet_Android.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          mkdir -p _android_project
          unzip -q FiiFiiDex_projet_Android.zip -d _android_project
          PROJECT_ROOT=$(dirname "$(find _android_project -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Projet Android introuvable dans le ZIP"
            exit 1
          fi
          cp -a "$PROJECT_ROOT"/. .

      - name: Lire la configuration Android
        run: |
          echo "=== APP BUILD GRADLE ==="
          find . -path "*/app/build.gradle*" -type f -print -exec cat {} \;

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Forcer Java et Kotlin en version 17
        run: |
          cat > ci-java17.init.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }
                  tasks.configureEach { task ->
                      if (task.class.name.contains('KotlinCompile')) {
                          task.kotlinOptions.jvmTarget = '17'
                      }
                  }
              }
          }
          EOF

      - name: Compiler FiiFiiDex
        run: gradle -I ci-java17.init.gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: FiiFiiDex-APK
          path: app/build/outputs/apk/debug/*.apk
