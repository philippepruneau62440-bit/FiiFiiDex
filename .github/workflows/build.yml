
name: Build FiiFiiDex APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FiiFiiDex_projet_Android.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          mkdir -p _android_project
          unzip -q FiiFiiDex_projet_Android.zip -d _android_project
          PROJECT_ROOT=$(dirname "$(find _android_project -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Projet Android introuvable dans le ZIP"
            exit 1
          fi
          cp -a "$PROJECT_ROOT"/. .

      - name: Corriger la cible Java Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          if not p.is_file():
              raise SystemExit("Fichier app/build.gradle.kts introuvable")

          s = p.read_text()
          if "compileOptions" not in s:
              if "android {" not in s:
                  raise SystemExit("Bloc android introuvable")
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )
              p.write_text(s)

          print(p.read_text())
          PY

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compiler FiiFiiDex
        run: gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: FiiFiiDex-APK
          path: app/build/outputs/apk/debug/*.apk

